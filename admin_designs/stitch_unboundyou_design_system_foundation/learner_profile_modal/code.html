        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;

<body class="bg-surface font-body-main text-on-surface antialiased h-screen overflow-hidden flex">
<!-- Background Layer (Simulating Learners List) -->
<div class="flex-1 ml-sidebar_width flex flex-col h-screen opacity-50 pointer-events-none filter blur-sm">
<header class="flex justify-between items-center h-16 px-gutter border-b border-outline-variant bg-surface">

</header>
<main class="p-gutter flex-1 bg-surface-container-low"></main>
</div>
<!-- Modal Overlay -->
<div aria-modal="true" class="fixed inset-0 z-50 flex justify-end bg-on-surface/20 backdrop-blur-sm transition-opacity" role="dialog">

<div class="w-full max-w-3xl h-full bg-surface shadow-[0px_8px_24px_rgba(15,23,41,0.12)] border-l border-outline-variant flex flex-col transform transition-transform duration-300 ease-in-out translate-x-0 overflow-hidden">

<div class="flex items-start justify-between">
<div class="flex gap-6 items-start">

</div>

<div class="flex items-center gap-3">
<h2 class="font-page-title text-page-title text-on-surface">Alex Johnson</h2>
<span class="bg-surface-variant text-on-surface-variant font-label-bold text-label-bold px-2 py-1 rounded">U-1024</span>
</div>
<div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-2 text-on-surface-variant font-body-main text-body-main">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] icon-stroke-thin" data-icon="call">call</span>
<span>+1 555-1234</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] icon-stroke-thin" data-icon="mail">mail</span>
<span>alex@example.com</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] icon-stroke-thin" data-icon="calendar_today">calendar_today</span>
<span>Oct 12, 2024</span>
</div>
</div>
</div>
</div>

<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>

<button class="pb-3 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-body-main text-body-main px-1 whitespace-nowrap transition-colors">Sessions</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-body-main text-body-main px-1 whitespace-nowrap transition-colors">Fees</button>
<button class="pb-3 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-body-main text-body-main px-1 whitespace-nowrap transition-colors">Communications</button>
</div>

<div class="flex-1 overflow-y-auto custom-scrollbar p-gutter bg-surface-container-lowest">

<div>

<div class="mt-3 flex items-center gap-2">
<div class="flex-1 h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-3/4"></div>
</div>
<span class="font-label-bold text-[10px] text-primary">75%</span>
</div>
</div>
</div>
</div>

<span class="material-symbols-outlined icon-stroke-thin" data-icon="delete">delete</span>
</button>
<div class="flex items-start gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="design_services">design_services</span>
</div>
<div>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
