<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Test - UnboundYou</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#002112",
                      "on-primary-container": "#fefcff",
                      "outline-variant": "#c1c6d6",
                      "surface-container-low": "#f2f3ff",
                      "on-background": "#131b2d",
                      "on-primary": "#ffffff",
                      "secondary-container": "#67f9b4",
                      "secondary": "#006c46",
                      "surface": "#faf8ff",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#ffb95f",
                      "on-primary-fixed": "#001a41",
                      "on-secondary": "#ffffff",
                      "secondary-fixed-dim": "#49df9d",
                      "inverse-on-surface": "#edf0ff",
                      "surface-dim": "#d2d9f3",
                      "error": "#ba1a1a",
                      "surface-container": "#e9edff",
                      "surface-container-highest": "#dbe2fb",
                      "on-primary-fixed-variant": "#004494",
                      "surface-tint": "#005bc1",
                      "on-surface": "#131b2d",
                      "primary-container": "#0e70e9",
                      "surface-container-high": "#e1e8ff",
                      "on-tertiary-container": "#fffbff",
                      "surface-bright": "#faf8ff",
                      "secondary-fixed": "#6afcb7",
                      "on-error-container": "#93000a",
                      "surface-variant": "#dbe2fb",
                      "primary-fixed": "#d8e2ff",
                      "background": "#faf8ff",
                      "error-container": "#ffdad6",
                      "on-tertiary-fixed-variant": "#653e00",
                      "on-tertiary-fixed": "#2a1700",
                      "on-tertiary": "#ffffff",
                      "primary-fixed-dim": "#adc6ff",
                      "primary": "#0058bc",
                      "on-secondary-fixed-variant": "#005234",
                      "tertiary-fixed": "#ffddb8",
                      "outline": "#727785",
                      "on-surface-variant": "#414754",
                      "tertiary-container": "#a36700",
                      "on-error": "#ffffff",
                      "tertiary": "#825100",
                      "on-secondary-container": "#007149",
                      "inverse-surface": "#283043",
                      "inverse-primary": "#adc6ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack_sm": "8px",
                      "sidebar_width": "248px",
                      "stack_md": "16px",
                      "gutter": "24px",
                      "container_max": "1440px",
                      "stack_lg": "32px"
              },
              "fontFamily": {
                      "page-title-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "body-main": [
                              "Plus Jakarta Sans"
                      ],
                      "label-bold": [
                              "Plus Jakarta Sans"
                      ],
                      "page-title": [
                              "Plus Jakarta Sans"
                      ],
                      "section-title": [
                              "Plus Jakarta Sans"
                      ]
              },
              "fontSize": {
                      "page-title-mobile": [
                              "22px",
                              {
                                      "lineHeight": "28px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-main": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-bold": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.02em",
                                      "fontWeight": "600"
                              }
                      ],
                      "page-title": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "section-title": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-main text-body-main antialiased h-full">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-50 flex items-center justify-center p-gutter">
<!-- Modal Container -->
<div class="bg-surface w-full max-w-4xl rounded-xl shadow-[0_8px_24px_rgba(15,23,41,0.12)] border border-outline-variant flex flex-col max-h-[921px]">
<!-- Header -->
<div class="flex items-center justify-between p-stack_md border-b border-outline-variant shrink-0">
<h2 class="font-section-title text-section-title text-on-surface">Create Test</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-stack_lg overflow-y-auto flex-1 space-y-stack_lg">
<!-- Test Name -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-stack_sm uppercase tracking-wider">Test Name</label>
<input class="w-full h-10 px-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" placeholder="e.g. Mid-term Algebra Quiz" type="text"/>
</div>
<!-- Question Block -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack_md shadow-[0_4px_12px_rgba(15,23,41,0.08)]">
<div class="flex items-center justify-between mb-stack_md">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="font-label-bold text-label-bold">Q1</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<div class="relative group">
<button class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors font-body-main text-body-main">
                                    Only one correct
                                    <span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</button>
<!-- Dropdown Placeholder -->
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Editor Toolbar -->
<div class="flex items-center gap-1 border border-outline-variant rounded-t-lg bg-surface-container p-2">
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">format_bold</span></button>
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">format_italic</span></button>
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">format_underlined</span></button>
<div class="w-[1px] h-4 bg-outline-variant mx-1"></div>
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">format_list_bulleted</span></button>
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">format_list_numbered</span></button>
<div class="w-[1px] h-4 bg-outline-variant mx-1"></div>
<button class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[18px]">image</span></button>
</div>
<!-- Editor Area -->
<textarea class="w-full h-24 p-3 border-x border-b border-outline-variant rounded-b-lg resize-none bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all mb-stack_md" placeholder="Enter your question here..."></textarea>
<!-- Options -->
<div class="space-y-3">
<!-- Option 1 (Correct) -->
<div class="flex items-center gap-3">
<button class="text-[#08BD7E] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined filled text-[24px]">radio_button_checked</span>
</button>
<input class="flex-1 h-10 px-3 rounded-lg border border-[#08BD7E]/30 bg-surface text-on-surface focus:outline-none focus:border-[#08BD7E] focus:ring-1 focus:ring-[#08BD7E]/20 transition-all" type="text" value="Option A"/>
<button class="text-outline hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Option 2 -->
<div class="flex items-center gap-3">
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">radio_button_unchecked</span>
</button>
<input class="flex-1 h-10 px-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all" placeholder="Option B" type="text"/>
<button class="text-outline hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Option 3 -->
<div class="flex items-center gap-3">
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">radio_button_unchecked</span>
</button>
<input class="flex-1 h-10 px-3 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all" placeholder="Option C" type="text"/>
<button class="text-outline hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<button class="text-primary hover:text-primary-container font-label-bold text-label-bold flex items-center gap-1 transition-colors mt-2">
<span class="material-symbols-outlined text-[16px]">add</span> Add Option
                        </button>
</div>
</div>
<!-- Add Question Button -->
<button class="w-full py-4 border-2 border-dashed border-outline-variant rounded-xl text-on-surface-variant font-label-bold text-label-bold hover:border-primary hover:text-primary hover:bg-surface-container-low transition-all flex flex-col items-center justify-center gap-1">
<span class="material-symbols-outlined">add_circle</span>
                    Add new question
                </button>
<!-- Advanced Options -->
<div class="border border-outline-variant rounded-lg overflow-hidden">
<button class="w-full px-stack_md py-3 flex items-center justify-between bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors">
<span class="font-label-bold text-label-bold">Advanced Options</span>
<span class="material-symbols-outlined text-outline">expand_more</span>
</button>
<!-- Content would go here, collapsed by default -->
</div>
</div>
<!-- Footer -->
<div class="p-stack_md border-t border-outline-variant bg-surface flex justify-between items-center shrink-0 rounded-b-xl">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-surface-container-low transition-colors">
                    Save for later
                </button>
<button class="px-6 py-2.5 rounded-lg bg-[#2F80F9] text-on-primary font-label-bold text-label-bold hover:bg-[#2F80F9]/90 shadow-sm transition-all">
                    Next
                </button>
</div>
</div>
</div>
</body></html>
